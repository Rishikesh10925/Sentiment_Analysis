# Local production-like stack: nginx-served frontend -> API -> PostgreSQL.
# The API container uses requirements-api.txt (no Spark/torch).
#
#   docker compose up --build
#   open http://localhost:8080
#
# The database starts empty. Populate it once from the curated corpus:
#   python -m backend.db.load_real_data
# (run against the compose database with DB_HOST=127.0.0.1 DB_PORT=5434).

services:
  db:
    image: postgres:16
    container_name: sentiment-postgres
    # Parallel aggregate queries over 1.6M rows allocate dynamic shared memory.
    # Docker's 64 MB default is too small and surfaces as
    # "could not resize shared memory segment ... DiskFull".
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-social_sentiment}
    ports:
      - "5434:5432"  # host port 5434, avoiding the default 5432 in case something else on your machine already uses it
    volumes:
      - sentiment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-social_sentiment}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: sentiment-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-social_sentiment}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      API_KEY: ${API_KEY:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      NEGATIVE_SENTIMENT_ALERT_THRESHOLD: ${NEGATIVE_SENTIMENT_ALERT_THRESHOLD:-40}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: sentiment-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sentiment_pgdata:
